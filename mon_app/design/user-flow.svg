<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><defs></defs><rect x="0" y="0" width="1400" height="720" fill="#f8fafc"/><text x="60" y="60" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#0f172a" font-weight="800">User Flow · Gambling Movie</text><text x="60" y="90" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#64748b" >Choisir un genre → lancer la roulette → découvrir le film → l'accepter (ou relancer)</text><rect x="1010" y="40" width="330" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d"/><text x="1030" y="71" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#92400e" font-weight="700">Persona : Léa (21 ans, Yverdon-les-Bains)</text><g transform="translate(60 130)"><rect x="0" y="0" width="280" height="500" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="38" cy="42" r="18" fill="#fef3c7"/><text x="38" y="49" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#b45309" font-weight="800" text-anchor="middle">1</text><text x="70" y="38" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" letter-spacing="1">ÉCRAN 1 · ACCUEIL</text><text x="70" y="60" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Choix du genre</text><path d="M20 82 H260" stroke="#f1f5f9" stroke-width="2"/><text x="20" y="112" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">Action de l'utilisatrice :</text><text x="20" y="137" font-family="Georgia, serif" font-size="14" fill="#334155" >Léa ouvre l'app à 21 h,</text><text x="20" y="157" font-family="Georgia, serif" font-size="14" fill="#334155" >au lit, téléphone en main,</text><text x="20" y="177" font-family="Georgia, serif" font-size="14" fill="#334155" >et touche « Horreur ».</text><rect x="30" y="212" width="220" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><rect x="45" y="226" width="90" height="10" rx="3" fill="#334155"/><rect x="45" y="246" width="190" height="28" rx="5" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="264" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#334155" >Action</text><rect x="45" y="282" width="190" height="28" rx="5" fill="#fff" stroke="#b45309" stroke-width="2"/><text x="56" y="300" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#334155" font-weight="700">Horreur</text><rect x="45" y="318" width="190" height="28" rx="5" fill="#fff" stroke="#e2e8f0" stroke-width="1"/><text x="56" y="336" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#334155" >Science-fiction</text><rect x="20" y="396" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="36" y="422" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#166534" font-weight="700">✓ Feedback immédiat :</text><text x="36" y="444" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" >Les 6 genres s'affichent.</text></g><path d="M345 380 H385" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M385 374 L395 380 L385 386 Z" fill="#b45309"/><g transform="translate(395 130)"><rect x="0" y="0" width="280" height="500" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="38" cy="42" r="18" fill="#fef3c7"/><text x="38" y="49" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#b45309" font-weight="800" text-anchor="middle">2</text><text x="70" y="38" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" letter-spacing="1">ÉCRAN 2 · ROULETTE</text><text x="70" y="60" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Lancer le tirage</text><path d="M20 82 H260" stroke="#f1f5f9" stroke-width="2"/><text x="20" y="112" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">Action de l'utilisatrice :</text><text x="20" y="137" font-family="Georgia, serif" font-size="14" fill="#334155" >La puce « Horreur » est</text><text x="20" y="157" font-family="Georgia, serif" font-size="14" fill="#334155" >active. Elle touche</text><text x="20" y="177" font-family="Georgia, serif" font-size="14" fill="#334155" >« Lancer la roulette ».</text><rect x="30" y="212" width="220" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><rect x="45" y="222" width="60" height="18" rx="9" fill="#b45309"/><text x="75" y="234.6" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">Horreur</text><circle cx="140" cy="306" r="52" fill="#fff" stroke="#334155" stroke-width="2"/><path d="M123.9 355.5 L156.1 256.5" stroke="#cbd5e1" stroke-width="1.5"/><path d="M97.9 336.6 L182.1 275.4" stroke="#cbd5e1" stroke-width="1.5"/><path d="M88.0 306.0 L192.0 306.0" stroke="#cbd5e1" stroke-width="1.5"/><path d="M97.9 275.4 L182.1 336.6" stroke="#cbd5e1" stroke-width="1.5"/><path d="M123.9 256.5 L156.1 355.5" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="140" cy="306" r="8" fill="#b45309"/><path d="M140 266 L133 250 H147 Z" fill="#b45309"/><rect x="20" y="396" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="36" y="422" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#166534" font-weight="700">✓ Feedback immédiat :</text><text x="36" y="444" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" >La roue tourne ~2 s.</text></g><path d="M680 380 H720" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M720 374 L730 380 L720 386 Z" fill="#b45309"/><g transform="translate(730 130)"><rect x="0" y="0" width="280" height="500" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="38" cy="42" r="18" fill="#fef3c7"/><text x="38" y="49" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#b45309" font-weight="800" text-anchor="middle">3</text><text x="70" y="38" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#b45309" font-weight="700" letter-spacing="1">ÉCRAN 3 · FICHE FILM</text><text x="70" y="60" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Découvrir le film</text><path d="M20 82 H260" stroke="#f1f5f9" stroke-width="2"/><text x="20" y="112" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">Action de l'utilisatrice :</text><text x="20" y="137" font-family="Georgia, serif" font-size="14" fill="#334155" >Elle lit le titre, la durée</text><text x="20" y="157" font-family="Georgia, serif" font-size="14" fill="#334155" >(1 h 38) et le synopsis :</text><text x="20" y="177" font-family="Georgia, serif" font-size="14" fill="#334155" >ça finit avant minuit.</text><rect x="30" y="212" width="220" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><rect x="45" y="226" width="50" height="74" rx="4" fill="#334155"/><rect x="105" y="230" width="110" height="10" rx="2" fill="#0f172a"/><rect x="105" y="248" width="54" height="9" rx="2" fill="#b45309"/><rect x="105" y="266" width="120" height="6" rx="2" fill="#94a3b8"/><rect x="105" y="280" width="96" height="6" rx="2" fill="#94a3b8"/><rect x="45" y="312" width="190" height="24" rx="12" fill="#b45309"/><text x="140" y="327.96" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">Je regarde ça</text><rect x="45" y="342" width="190" height="22" rx="11" fill="none" stroke="#b45309" stroke-width="1.5"/><text x="140" y="356.96" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Relancer</text><rect x="20" y="396" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="36" y="422" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#166534" font-weight="700">✓ Feedback immédiat :</text><text x="36" y="444" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" >Fiche visible sans scroll.</text></g><path d="M1015 380 H1055" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><path d="M1055 374 L1065 380 L1055 386 Z" fill="#b45309"/><g transform="translate(1065 130)"><rect x="0" y="0" width="280" height="500" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><circle cx="38" cy="42" r="18" fill="#dcfce7"/><text x="38" y="49" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#166534" font-weight="800" text-anchor="middle">4</text><text x="70" y="38" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#166534" font-weight="700" letter-spacing="1">CONFIRMATION</text><text x="70" y="60" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Je regarde ça !</text><path d="M20 82 H260" stroke="#f1f5f9" stroke-width="2"/><text x="20" y="112" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#475569" font-weight="600">Action de l'utilisatrice :</text><text x="20" y="137" font-family="Georgia, serif" font-size="14" fill="#334155" >Elle touche « Je regarde</text><text x="20" y="157" font-family="Georgia, serif" font-size="14" fill="#334155" >ça » : le film est choisi,</text><text x="20" y="177" font-family="Georgia, serif" font-size="14" fill="#334155" >sans compte ni pub.</text><rect x="30" y="212" width="220" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="140" cy="268" r="24" fill="#22c55e"/><path d="M129 268 L137 276 L152 260" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="318" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">C'est validé ! Bon film</text><text x="140" y="340" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Nuit au Chasseron · 1 h 38</text><rect x="20" y="396" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="36" y="422" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#166534" font-weight="700">✓ Objectif accompli :</text><text x="36" y="444" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#334155" >Film choisi en ~30 s.</text></g><path d="M870 636 V662 H535 V646" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M529 648 L535 636 L541 648 Z" fill="#94a3b8"/><text x="702" y="692" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Boucle « Relancer » : retour à la roulette, le film refusé est exclu du tirage suivant</text></svg>